<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROYAL ARENA | منصة البطولات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #151e32;
            --accent-gold: #f59e0b;
        }
        body { background-color: var(--bg-main); color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }
        .card-glass { background: var(--bg-card); border: 1px solid rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- الشريط العلوي -->
    <header class="bg-[#0f172a] border-b border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-6 space-x-reverse">
                <a href="#" class="text-2xl font-extrabold text-amber-500 tracking-wider">ROYAL<span class="text-white">ARENA</span></a>
                <nav class="hidden md:flex space-x-6 space-x-reverse text-sm font-medium">
                    <a href="#" class="text-amber-500">البطولات</a>
                    <a href="#admin-panel" onclick="toggleSection('admin-section')" class="text-emerald-400"><i class="fas fa-user-shield ml-1"></i> لوحة التحكم</a>
                </nav>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center">
                    <span class="text-xs text-slate-400 ml-2">الرصيد:</span>
                    <span id="user-balance" class="font-bold text-amber-400">جاري التحميل...</span>
                </div>
                <button onclick="openWalletModal('deposit')" class="gold-gradient text-slate-950 font-bold px-4 py-1.5 rounded-lg text-sm">إيداع</button>
                <button onclick="openWalletModal('withdraw')" class="bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 px-4 py-1.5 rounded-lg text-sm">سحب</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="main-content" class="container mx-auto px-4 py-8 flex-grow">
        <div class="relative rounded-2xl overflow-hidden mb-10 bg-gradient-to-r from-blue-950 via-slate-900 to-amber-950 border border-amber-500/30 p-8 shadow-2xl">
            <h1 class="text-3xl font-black mb-3">تحدي النخبة الذهبي 2026</h1>
            <p class="text-slate-300 mb-6 text-sm">نافس على مجموع جوائز يصل إلى <span class="text-amber-400 font-bold">500,000 جنيه</span>.</p>
        </div>
    </main>

    <!-- لوحة التحكم -->
    <section id="admin-section" class="hidden container mx-auto px-4 py-8 flex-grow">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <h2 class="text-2xl font-bold text-emerald-400">لوحة التحكم</h2>
            <button onclick="toggleSection('main-content')" class="bg-slate-800 px-4 py-2 rounded-lg text-sm">العودة</button>
        </div>
    </section>

    <!-- نافذة الإيداع والسحب -->
    <div id="wallet-modal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
        <div class="bg-[#151e32] border border-amber-500/40 rounded-2xl max-w-md w-full p-6 relative">
            <button onclick="closeWalletModal()" class="absolute top-4 left-4 text-slate-400"><i class="fas fa-times"></i></button>
            <h3 id="modal-title" class="text-xl font-bold text-amber-400 mb-4">إيداع رصيد</h3>
            <form onsubmit="processPayment(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block text-slate-400 mb-1">المبلغ (EGP)</label>
                    <input type="number" id="pay-amount" required min="50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">رقم المحفظة / المرجع</label>
                    <input type="text" id="pay-ref" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
                <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl">تأكيد الطلب</button>
            </form>
        </div>
    </div>

    <script>
        let currentUserId = "user_1";
        let currentMode = 'deposit';
        let selectedMethod = 'فودافون كاش';

        async function fetchUserBalance() {
            try {
                const res = await fetch(`/api/user/${currentUserId}`);
                const data = await res.json();
                document.getElementById('user-balance').innerText = data.balance.toLocaleString() + " EGP";
            } catch (e) {
                console.error("خطأ في الاتصال");
            }
        }
        window.onload = fetchUserBalance;

        function toggleSection(sectionId) {
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('admin-section').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        function openWalletModal(mode) {
            currentMode = mode;
            document.getElementById('wallet-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = mode === 'deposit' ? 'إيداع رصيد' : 'سحب أرباح';
        }

        function closeWalletModal() {
            document.getElementById('wallet-modal').classList.add('hidden');
        }

        async function processPayment(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('pay-amount').value);
            const ref = document.getElementById('pay-ref').value;

            try {
                const res = await fetch('/api/wallet/transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, type: currentMode, method: selectedMethod, amount, reference: ref })
                });
                const data = await res.json();
                if(!res.ok) { alert(data.error); return; }

                document.getElementById('user-balance').innerText = data.balance.toLocaleString() + " EGP";
                alert('تم إرسال الطلب بنجاح وسيتم مراجعته!');
                closeWalletModal();
                e.target.reset();
            } catch (err) {
                alert('حدث خطأ في الاتصال بالسيرفر.');
            }
        }
    </script>
</body>
</html>
